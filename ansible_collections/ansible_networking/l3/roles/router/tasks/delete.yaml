---
# Deletes a per-tenant router (Linux namespace) from the network node.
# All interfaces, routes, and iptables rules inside the namespace
# are automatically cleaned up when the namespace is removed.
#
# Required variables:
#   router_name: namespace name (e.g., "tenant-alpha")

- name: Delete namespace {{ router_name }}
  ansible.builtin.raw: ip netns delete {{ router_name }}
  ignore_errors: true

- name: Clean up host-side veth endpoint
  ansible.builtin.raw: ip link delete v-{{ router_name }}-o
  ignore_errors: true
