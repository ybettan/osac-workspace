---
# Removes SNAT rules for a tenant.
#
# Required variables:
#   snat_router_name: namespace name
#   snat_source_subnet: tenant subnet
#   snat_veth_interface: namespace-side veth name
#   snat_external_subnet: veth link subnet
#   snat_external_interface: host external interface

- name: Remove SNAT inside namespace
  ansible.builtin.raw: >
    ip netns exec {{ snat_router_name }}
    iptables -t nat -D POSTROUTING -s {{ snat_source_subnet }} -o {{ snat_veth_interface }} -j MASQUERADE 2>/dev/null || true

- name: Remove SNAT on host
  ansible.builtin.raw: >
    iptables -t nat -D POSTROUTING -s {{ snat_external_subnet }} -o {{ snat_external_interface }} -j MASQUERADE 2>/dev/null || true
