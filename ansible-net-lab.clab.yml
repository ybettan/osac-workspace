name: ybettan-ansible-net-lab

topology:
  kinds:
    cvx:
      image: networkop/cx:5.3.0
    linux:
      image: alpine:3.19

  nodes:
    # Leaf switches (no spine — VLAN-only, no BGP routing needed)
    leaf-1:
      kind: cvx
      mgmt-ipv4: 172.20.20.11
      binds:
        - /lib/modules:/lib/modules:ro

    leaf-2:
      kind: cvx
      mgmt-ipv4: 172.20.20.12
      binds:
        - /lib/modules:/lib/modules:ro

    # Linux hosts simulating bare-metal workers
    host-1:
      kind: linux
      mgmt-ipv4: 172.20.20.20

    host-2:
      kind: linux
      mgmt-ipv4: 172.20.20.21

    host-3:
      kind: linux
      mgmt-ipv4: 172.20.20.22

    # Network node (per-tenant routing, SNAT/DNAT via Linux namespaces)
    net-node:
      kind: linux
      mgmt-ipv4: 172.20.20.30

    # Upstream router (simulates DC edge, eBGP peer for net-node)
    upstream-router:
      kind: linux
      mgmt-ipv4: 172.20.20.40

  links:
    # Leaf-1 <-> Leaf-2 trunk (carries all VLANs between switches)
    - endpoints: ["leaf-1:swp1", "leaf-2:swp1"]

    # Leaf-1 <-> hosts + network node
    - endpoints: ["leaf-1:swp2", "host-1:eth1"]
    - endpoints: ["leaf-1:swp3", "net-node:eth1"]

    # Leaf-2 <-> hosts
    - endpoints: ["leaf-2:swp2", "host-2:eth1"]
    - endpoints: ["leaf-2:swp3", "host-3:eth1"]

    # Net-node <-> upstream router (eBGP peering link)
    - endpoints: ["net-node:eth2", "upstream-router:eth1"]
