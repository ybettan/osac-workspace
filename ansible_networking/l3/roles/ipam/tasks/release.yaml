---
# Releases an IP allocation from the state file.
#
# Required variables:
#   ipam_state_file: path to JSON state file
#   ipam_purpose: label of the allocation to release

- name: Release allocation {{ ipam_purpose }}
  ansible.builtin.raw: |
    python3 -c "
    import json
    with open('{{ ipam_state_file }}', 'r') as f:
        state = json.load(f)
    state['public_ips'].pop('{{ ipam_purpose }}', None)
    with open('{{ ipam_state_file }}', 'w') as f:
        json.dump(state, f, indent=2)
    "
