---
# Allocates IPs from a configured pool, tracked in a state file.
#
# Required variables:
#   ipam_state_file: path to JSON state file (e.g., "/etc/osac/network_state.json")
#   ipam_pool_start: first IP in pool (e.g., "203.0.113.10")
#   ipam_pool_end: last IP in pool (e.g., "203.0.113.50")
#   ipam_purpose: label for this allocation (e.g., "tenant-alpha-snat")
#   ipam_count: number of IPs to allocate (default: 1)
#
# Returns:
#   ipam_allocated_ips: list of allocated IP strings

- name: Ensure state file directory exists
  ansible.builtin.raw: mkdir -p $(dirname {{ ipam_state_file }})

- name: Ensure state file exists
  ansible.builtin.raw: |
    test -f {{ ipam_state_file }} || echo '{"vlans":{},"public_ips":{}}' > {{ ipam_state_file }}

- name: Read current state
  ansible.builtin.raw: cat {{ ipam_state_file }}
  register: ipam_state_raw

- name: Parse state and allocate IPs
  ansible.builtin.set_fact:
    ipam_current_state: "{{ ipam_state_raw.stdout | from_json }}"

- name: Check if already allocated
  ansible.builtin.set_fact:
    ipam_existing: "{{ ipam_current_state.public_ips[ipam_purpose] | default('') }}"

- name: Return existing allocation if present
  ansible.builtin.set_fact:
    ipam_allocated_ips: ["{{ ipam_existing }}"]
  when: ipam_existing | length > 0

- name: Find next available IP and allocate
  when: ipam_existing | length == 0
  block:
    - name: Build list of already-used IPs
      ansible.builtin.set_fact:
        ipam_used_ips: "{{ ipam_current_state.public_ips.values() | list }}"

    - name: Allocate next available IP
      ansible.builtin.raw: |
        python3 -c "
        import ipaddress, json, sys
        used = {{ ipam_used_ips | to_json }}
        start = ipaddress.IPv4Address('{{ ipam_pool_start }}')
        end = ipaddress.IPv4Address('{{ ipam_pool_end }}')
        allocated = []
        ip = start
        while ip <= end and len(allocated) < {{ ipam_count | default(1) }}:
            if str(ip) not in used:
                allocated.append(str(ip))
            ip += 1
        if len(allocated) < {{ ipam_count | default(1) }}:
            sys.exit(1)
        print(json.dumps(allocated))
        "
      register: ipam_new_ips_raw

    - name: Set allocated IPs
      ansible.builtin.set_fact:
        ipam_allocated_ips: "{{ ipam_new_ips_raw.stdout | trim | from_json }}"

    - name: Write allocation to state file
      ansible.builtin.raw: |
        python3 -c "
        import json
        with open('{{ ipam_state_file }}', 'r') as f:
            state = json.load(f)
        ips = {{ ipam_allocated_ips | to_json }}
        if len(ips) == 1:
            state['public_ips']['{{ ipam_purpose }}'] = ips[0]
        else:
            for i, ip in enumerate(ips):
                state['public_ips']['{{ ipam_purpose }}-' + str(i)] = ip
        with open('{{ ipam_state_file }}', 'w') as f:
            json.dump(state, f, indent=2)
        "
