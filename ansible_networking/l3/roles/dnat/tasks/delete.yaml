---
# Removes a DNAT port-forwarding rule from a tenant's namespace.
#
# Required variables:
#   dnat_router_name: namespace name
#   dnat_public_ip: IP receiving traffic
#   dnat_public_port: external port
#   dnat_internal_ip: target service IP
#   dnat_internal_port: target service port

- name: Remove DNAT rule from namespace {{ dnat_router_name }}
  ansible.builtin.raw: >
    ip netns exec {{ dnat_router_name }}
    iptables -t nat -D PREROUTING -d {{ dnat_public_ip }} -p tcp --dport {{ dnat_public_port }}
    -j DNAT --to-destination {{ dnat_internal_ip }}:{{ dnat_internal_port }} 2>/dev/null || true
