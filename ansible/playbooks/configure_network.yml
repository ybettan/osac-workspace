---
# Initial switch fabric setup (admin task, done once).
# Configures trunk ports so VLANs can traverse between switches
# and reach the network node.
#
# Everything else (VLAN creation, access port assignment) happens
# at runtime when the orchestration layer provisions a tenant.
#
# Uses the network-runner role for vendor-agnostic switch config.
# Install: pip install git+https://github.com/ybettan/network-runner.git

- name: Configure trunk ports on all switches
  hosts: switches
  gather_facts: false
  tasks:
    - name: Configure trunk port {{ trunk_port }}
      ansible.builtin.include_role:
        name: network-runner
        tasks_from: conf_trunk_port
      vars:
        port_name: "{{ trunk_port }}"
        port_description: "trunk-{{ trunk_port }}"
      loop: "{{ trunk_ports }}"
      loop_control:
        loop_var: trunk_port
