---
# Configures a single tenant on both leaf switches using NVUE (nv set):
#   - VRF for L3 isolation
#   - VLAN on the server-facing port
#   - L2 VNI (VXLAN tunnel for bridged traffic)
#   - L3 VNI (VXLAN tunnel for routed traffic)
#   - BGP underlay between leaves and spine (eBGP)
#   - EVPN overlay to extend the tenant network across leaves
#
# Variables (pass via -e or group_vars):
#   tenant_name:   e.g. "tenant-a"
#   tenant_vlan:   e.g. 100
#   tenant_l2_vni: e.g. 10100
#   tenant_l3_vni: e.g. 10001
#   tenant_subnet: e.g. "10.100.0.0/24"
#   leaf1_loopback: e.g. "10.0.0.1/32"
#   leaf2_loopback: e.g. "10.0.0.2/32"
#   spine_loopback: e.g. "10.0.0.3/32"
#   leaf1_asn: e.g. 65001
#   leaf2_asn: e.g. 65002
#   spine_asn: e.g. 65000

- name: Configure BGP underlay and EVPN overlay on spine
  hosts: spine
  gather_facts: false
  tasks:
    - name: Configure spine loopback and BGP via NVUE
      raw: |
        sudo nv set interface lo ip address {{ spine_loopback }}
        sudo nv set router bgp autonomous-system {{ spine_asn }}
        sudo nv set router bgp enable on
        sudo nv set vrf default router bgp neighbor swp1 remote-as external
        sudo nv set vrf default router bgp neighbor swp1 type unnumbered
        sudo nv set vrf default router bgp neighbor swp1 address-family l2vpn-evpn enable on
        sudo nv set vrf default router bgp neighbor swp2 remote-as external
        sudo nv set vrf default router bgp neighbor swp2 type unnumbered
        sudo nv set vrf default router bgp neighbor swp2 address-family l2vpn-evpn enable on
        sudo nv set vrf default router bgp address-family l2vpn-evpn enable on
        sudo nv set vrf default router bgp address-family ipv4-unicast redistribute connected enable on
        sudo nv config apply -y

- name: Configure tenant VRF, VLAN, VXLAN and BGP on leaf-1
  hosts: clab-ybettan-ansible-net-lab-leaf-1
  gather_facts: false
  tasks:
    - name: Configure loopback, VRF, VLAN, VXLAN, and BGP via NVUE
      raw: |
        sudo nv set interface lo ip address {{ leaf1_loopback }}
        sudo nv set vrf {{ tenant_name }} evpn vni {{ tenant_l3_vni }}
        sudo nv set vrf {{ tenant_name }} evpn enable on
        sudo nv set bridge domain br_default vlan {{ tenant_vlan }}
        sudo nv set bridge domain br_default vlan {{ tenant_vlan }} vni {{ tenant_l2_vni }}
        sudo nv set interface {{ server_port }} bridge domain br_default access {{ tenant_vlan }}
        sudo nv set interface vlan{{ tenant_vlan }} ip vrr address {{ tenant_subnet | ansible.utils.ipaddr('1') }}
        sudo nv set interface vlan{{ tenant_vlan }} ip vrr state up
        sudo nv set interface vlan{{ tenant_vlan }} ip vrf {{ tenant_name }}
        sudo nv set nve vxlan source address {{ leaf1_loopback | regex_replace('/.*', '') }}
        sudo nv set router bgp autonomous-system {{ leaf1_asn }}
        sudo nv set router bgp enable on
        sudo nv set vrf default router bgp neighbor swp1 remote-as external
        sudo nv set vrf default router bgp neighbor swp1 type unnumbered
        sudo nv set vrf default router bgp neighbor swp1 address-family l2vpn-evpn enable on
        sudo nv set vrf default router bgp address-family l2vpn-evpn enable on
        sudo nv set vrf default router bgp address-family ipv4-unicast redistribute connected enable on
        sudo nv config apply -y

    - name: Enable advertise-all-vni on leaf-1 (not exposed via NVUE)
      raw: >
        sudo vtysh
        -c "configure terminal"
        -c "router bgp {{ leaf1_asn }}"
        -c "address-family l2vpn evpn"
        -c "advertise-all-vni"
        -c "end"
        -c "write memory"

- name: Configure tenant VRF, VLAN, VXLAN and BGP on leaf-2
  hosts: clab-ybettan-ansible-net-lab-leaf-2
  gather_facts: false
  tasks:
    - name: Configure loopback, VRF, VLAN, VXLAN, and BGP via NVUE
      raw: |
        sudo nv set interface lo ip address {{ leaf2_loopback }}
        sudo nv set vrf {{ tenant_name }} evpn vni {{ tenant_l3_vni }}
        sudo nv set vrf {{ tenant_name }} evpn enable on
        sudo nv set bridge domain br_default vlan {{ tenant_vlan }}
        sudo nv set bridge domain br_default vlan {{ tenant_vlan }} vni {{ tenant_l2_vni }}
        sudo nv set interface {{ server_port }} bridge domain br_default access {{ tenant_vlan }}
        sudo nv set interface vlan{{ tenant_vlan }} ip vrr address {{ tenant_subnet | ansible.utils.ipaddr('1') }}
        sudo nv set interface vlan{{ tenant_vlan }} ip vrr state up
        sudo nv set interface vlan{{ tenant_vlan }} ip vrf {{ tenant_name }}
        sudo nv set nve vxlan source address {{ leaf2_loopback | regex_replace('/.*', '') }}
        sudo nv set router bgp autonomous-system {{ leaf2_asn }}
        sudo nv set router bgp enable on
        sudo nv set vrf default router bgp neighbor swp1 remote-as external
        sudo nv set vrf default router bgp neighbor swp1 type unnumbered
        sudo nv set vrf default router bgp neighbor swp1 address-family l2vpn-evpn enable on
        sudo nv set vrf default router bgp address-family l2vpn-evpn enable on
        sudo nv set vrf default router bgp address-family ipv4-unicast redistribute connected enable on
        sudo nv config apply -y

    - name: Enable advertise-all-vni on leaf-2 (not exposed via NVUE)
      raw: >
        sudo vtysh
        -c "configure terminal"
        -c "router bgp {{ leaf2_asn }}"
        -c "address-family l2vpn evpn"
        -c "advertise-all-vni"
        -c "end"
        -c "write memory"
