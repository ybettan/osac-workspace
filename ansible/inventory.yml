all:
  vars:
    ansible_user: cumulus
    ansible_password: cumulus
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ansible_become_password: cumulus
    ansible_network_os: cumulus

  children:
    switches:
      hosts:
        clab-ybettan-ansible-net-lab-leaf-1:
          ansible_host: 172.20.20.11
          # Ports
          trunk_ports: [swp1, swp3]    # swp1=inter-switch, swp3=net-node
          access_ports:
            swp2: host-1               # facing host-1
        clab-ybettan-ansible-net-lab-leaf-2:
          ansible_host: 172.20.20.12
          # Ports
          trunk_ports: [swp1]          # swp1=inter-switch
          access_ports:
            swp2: host-2               # facing host-2
            swp3: host-3               # facing host-3

    net_nodes:
      hosts:
        clab-ybettan-ansible-net-lab-net-node:
          ansible_host: 172.20.20.30
          ansible_user: root
          ansible_password: root

    hosts:
      hosts:
        clab-ybettan-ansible-net-lab-host-1:
          ansible_host: 172.20.20.20
          ansible_user: root
        clab-ybettan-ansible-net-lab-host-2:
          ansible_host: 172.20.20.21
          ansible_user: root
        clab-ybettan-ansible-net-lab-host-3:
          ansible_host: 172.20.20.22
          ansible_user: root
